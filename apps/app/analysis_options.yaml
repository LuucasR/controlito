include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Un import de dart:io en codigo compartido rompe la compilacion web.
    # Que sea error y no aviso.
    avoid_web_libraries_in_flutter: error
    unused_import: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
