# Blueprint de Render. Con este archivo el deploy es reproducible:
# en vez de configurar la app a mano en el panel, Render lee esto del repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: controlito-api
    runtime: node
    # Ohio, la MISMA region que la base en Neon (aws-us-east-2).
    # Co-ubicar backend y base importa mas que acercar el backend al usuario:
    # un request del celular cruza la distancia una vez, pero el backend le
    # hace varias consultas seguidas a la base y cada una paga esa latencia.
    region: ohio
    plan: free
    rootDir: .
    branch: main

    # NODE_ENV=development solo durante el build: con production, pnpm omite las
    # devDependencies y no habria compilador de Nest, TypeScript ni CLI de Prisma.
    # Se usa la variable y no el flag --prod=false porque ese flag cambio de
    # sintaxis entre versiones de pnpm; la variable funciona en todas.
    # En ejecucion sigue valiendo NODE_ENV=production, definido mas abajo.
    #
    # db:deploy aplica las migraciones pendientes (usa DIRECT_URL, sin pooler).
    # Va en el build y no en un paso aparte porque el plan free no tiene comando
    # pre-deploy. Si una migracion falla, el deploy falla, que es lo correcto.
    # Contrapartida a tener en cuenta: corre mientras la version anterior sigue
    # viva, asi que toda migracion debe ser compatible hacia atras (agregar
    # antes de borrar, nunca las dos cosas en el mismo deploy).
    buildCommand: >-
      corepack enable &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @controlito/api db:generate &&
      pnpm --filter @controlito/api db:deploy &&
      pnpm --filter @controlito/api build

    startCommand: pnpm --filter @controlito/api start

    # Liveness, no readiness: este endpoint NO toca la base a proposito.
    # Si apuntara a /health/ready, Render reiniciaria el servicio cada vez que
    # Neon se suspende por inactividad.
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_VERSION
        value: "24"
      # Evita que corepack se quede esperando una confirmacion interactiva
      # al descargar la version de pnpm fijada en package.json.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_TZ
        value: America/Argentina/Buenos_Aires

      # Secreto de firma de los access tokens. Render lo genera solo (256 bits
      # aleatorios) y nunca pasa por el repositorio ni por nuestras manos.
      # Si se rota, todas las sesiones activas se invalidan: es el efecto
      # deseado ante una filtracion.
      - key: JWT_ACCESS_SECRET
        generateValue: true

      # Secretos: se cargan a mano en el panel de Render, nunca en el repo.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Origenes del front. Se completa cuando publiquemos la web.
      # Nunca '*': con credentials el navegador lo rechaza.
      - key: CORS_ORIGINS
        sync: false
