name: API

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/**', '.github/workflows/api.yml', 'pnpm-workspace.yaml']
  pull_request:
    paths: ['apps/api/**', 'packages/**', '.github/workflows/api.yml', 'pnpm-workspace.yaml']

env:
  # Prisma exige que estas existan para construir el cliente, pero no se usan:
  # los tests que tocan la base leen E2E_DATABASE_URL.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/controlito_ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/controlito_ci

  # Base contra la que corren los tests que crean y borran datos.
  # Debe apuntar a una branch de Neon dedicada, NUNCA a produccion.
  # Si el secreto no esta configurado, esas suites se saltean en vez de fallar.
  E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
  E2E_DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: toma la fijada en packageManager del package.json,
      # asi el CI usa exactamente la misma pnpm que local y que Render.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter @controlito/api db:generate

      # Incluye la regla que impide que src/domain importe NestJS o Prisma.
      - run: pnpm lint

      - run: pnpm typecheck

      - name: Tests del motor financiero
        run: pnpm test

      - name: Avisar si no hay base de tests configurada
        if: env.E2E_DATABASE_URL == ''
        run: |
          echo "::warning::E2E_DATABASE_URL no esta configurado: las suites que tocan la base se saltean. Configuralo en Settings > Secrets apuntando a una branch de Neon dedicada."

      - name: Tests HTTP end to end
        run: pnpm test:e2e

      - run: pnpm build
