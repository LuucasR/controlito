name: API

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/**', '.github/workflows/api.yml', 'pnpm-workspace.yaml']
  pull_request:
    paths: ['apps/api/**', 'packages/**', '.github/workflows/api.yml', 'pnpm-workspace.yaml']

env:
  # Base inalcanzable a proposito: los tests de esta etapa no necesitan una base
  # real, pero Prisma exige que la variable exista para construir el cliente.
  # Cuando la Etapa 1 introduzca tablas, se reemplaza por una branch efimera de Neon.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/controlito_ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/controlito_ci

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: toma la fijada en packageManager del package.json,
      # asi el CI usa exactamente la misma pnpm que local y que Render.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter @controlito/api db:generate

      # Incluye la regla que impide que src/domain importe NestJS o Prisma.
      - run: pnpm lint

      - run: pnpm typecheck

      - name: Tests del motor financiero
        run: pnpm test

      - name: Tests HTTP end to end
        run: pnpm test:e2e

      - run: pnpm build
