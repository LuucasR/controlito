name: App

on:
  push:
    branches: [main]
    paths: ['apps/app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['apps/app/**', '.github/workflows/app.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - run: flutter pub get

      - run: dart format --set-exit-if-changed --output=none .

      - run: flutter analyze --fatal-infos

      - run: flutter test

      # CRITICO: es el paso que detecta un import de dart:io u otra API no
      # disponible en navegador. Ese error, descubierto tarde, es el mas caro
      # de un proyecto Flutter multiplataforma.
      - run: flutter build web --release

      # El build de APK se agrega cuando configuremos el toolchain de Android.
      # Hoy no aporta senal y agrega varios minutos a cada PR.
